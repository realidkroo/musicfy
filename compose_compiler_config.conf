// Compose compiler stability configuration.
//
// Classes listed here are treated as stable even though the compiler cannot prove it.
// This is a promise, not a proof: if one of these is mutated in place after being passed
// to a composable, the UI will not update. Everything below is only ever replaced
// wholesale (a new instance emitted from a Flow), never mutated in place.

// Kotlin stdlib collection interfaces. The compiler cannot know an arbitrary List is not a
// mutable one behind the interface, so it infers them unstable. Every list reaching a
// composable in this app comes from Room, a StateFlow, or an InnerTube response, all of
// which emit fresh read-only instances.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
kotlin.collections.Collection

// java.time types used in song/album metadata rows. Immutable by contract.
java.time.LocalDateTime
java.time.LocalDate
java.time.Duration

// Provider response models. Deserialized once, never mutated.
com.music.innertube.models.**

// App-side database entities and their relation wrappers.
com.example.musicfy.db.entities.**
